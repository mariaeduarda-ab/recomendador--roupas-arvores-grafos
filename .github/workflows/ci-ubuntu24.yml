name: Validacao Ubuntu 24.04

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-demo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Informacoes do ambiente
        run: |
          lsb_release -a
          g++ --version | head -n 1
          make --version | head -n 1

      - name: Compilar (make -j4)
        run: make -j4

      - name: Testes unitarios (make test)
        run: make test

      - name: Exemplo (make demo)
        run: make demo
