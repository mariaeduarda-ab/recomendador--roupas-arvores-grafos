<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão das 50 peças</title>
<style>
:root {
  --fundo: #f6f4ef;
  --cartao: #ffffff;
  --texto: #2b2a28;
  --suave: #75716a;
  --linha: #e2ded5;
  --verde: #3f7d5a;
  --verde-claro: #e3efe7;
  --laranja: #b5651d;
  --laranja-claro: #fbeedd;
  --azul: #3d5a80;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fundo);
  color: var(--texto);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Ubuntu, Cantarell, sans-serif;
}
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 24px; background: var(--cartao); border-bottom: 1px solid var(--linha);
}
header h1 { font-size: 17px; font-weight: 600; margin: 0; }
#progresso { color: var(--suave); }
#progresso b { color: var(--texto); }
.espaco { flex: 1; }
button {
  font: inherit; padding: 7px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--linha); background: var(--cartao); color: var(--texto);
}
button:hover { border-color: var(--suave); }
button.principal { background: var(--verde); border-color: var(--verde); color: #fff; }
button.principal:hover { filter: brightness(1.08); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
#faixa {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 24px;
  border-bottom: 1px solid var(--linha); background: var(--cartao);
}
#faixa button {
  width: 28px; height: 24px; padding: 0; font-size: 11px; border-radius: 5px;
  color: var(--suave); position: relative;
}
#faixa button.ok { background: var(--verde-claro); border-color: #b7d3c1; color: var(--verde); }
#faixa button.atual { outline: 2px solid var(--azul); outline-offset: 1px; color: var(--texto); font-weight: 600; }
#faixa button.mudou::after {
  content: ""; position: absolute; top: 2px; right: 2px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--laranja);
}
main {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, 1fr);
  gap: 24px; padding: 20px 24px; max-width: 1280px; margin: 0 auto;
}
.cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 16px; }
#caixa-img {
  display: flex; align-items: center; justify-content: center;
  height: min(62vh, 560px); background: #fbfaf7; border-radius: 8px; overflow: hidden;
}
#caixa-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
#falha { text-align: center; color: var(--suave); padding: 16px; }
#falha p { margin: 0 0 10px; }
#texto { margin-top: 12px; }
#legenda { font-weight: 600; margin: 0 0 4px; }
#descricao { color: var(--suave); margin: 0; max-height: 8.5em; overflow: auto; font-size: 14px; }
#cabeca { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
#cabeca h2 { margin: 0; font-size: 20px; }
#cabeca span { color: var(--suave); font-size: 13px; }
#selo {
  margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 99px;
  background: var(--verde-claro); color: var(--verde);
}
.campo { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin-bottom: 10px; }
.campo label { font-weight: 500; }
.campo kbd { color: var(--suave); font-size: 11px; margin-right: 4px; }
select {
  font: inherit; width: 100%; padding: 7px 8px; border-radius: 8px;
  border: 1px solid var(--linha); background: #fff; color: var(--texto);
}
select:disabled { background: #f1efea; color: var(--suave); }
.campo.mudou select { border-color: var(--laranja); background: var(--laranja-claro); }
.antes { grid-column: 2; font-size: 12px; color: var(--laranja); margin-top: -6px; }
.campo.vazio select { border-color: #c0392b; }
#aviso { min-height: 1.4em; color: #c0392b; font-size: 14px; margin: 4px 0 8px; }
#acoes { display: flex; gap: 10px; flex-wrap: wrap; }
#acoes .principal { flex: 1; }
#atalhos { margin-top: 14px; color: var(--suave); font-size: 13px; }
#atalhos kbd {
  font: 12px ui-monospace, monospace; padding: 1px 5px;
  border: 1px solid var(--linha); border-radius: 4px; background: #faf9f6;
}
#teste {
  display: none; background: var(--laranja-claro); color: var(--laranja);
  padding: 6px 24px; font-size: 14px;
}
#pronto { display: none; margin-top: 12px; padding: 10px; border-radius: 8px; background: var(--verde-claro); color: var(--verde); }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; padding: 16px; }
  header, #faixa { padding-left: 16px; padding-right: 16px; }
  #caixa-img { height: 48vh; }
}
</style>
</head>
<body>
<header>
  <h1>Revisão das peças</h1>
  <span id="progresso"></span>
  <span class="espaco"></span>
  <button id="exportar" type="button">Exportar</button>
  <button id="recomecar" type="button">Recomeçar</button>
</header>
<div id="teste">Dados de teste. Os valores ainda não são os rótulos de verdade.</div>
<nav id="faixa" aria-label="Peças"></nav>
<main>
  <section class="cartao">
    <div id="caixa-img"></div>
    <div id="texto">
      <p id="legenda"></p>
      <p id="descricao"></p>
    </div>
  </section>
  <section class="cartao">
    <div id="cabeca"><h2 id="titulo"></h2><span id="ident"></span><span id="selo">confirmada</span></div>
    <div id="campos"></div>
    <div id="aviso"></div>
    <div id="acoes">
      <button id="anterior" type="button">← Anterior</button>
      <button id="confirmar" class="principal" type="button">Confirmar e seguir</button>
      <button id="proxima" type="button">Próxima →</button>
    </div>
    <div id="pronto">Todas as peças estão confirmadas. Agora é só clicar em Exportar.</div>
    <div id="atalhos">
      <kbd>Enter</kbd> confirma e segue.
      <kbd>←</kbd> <kbd>→</kbd> trocam de peça.
      <kbd>1</kbd> a <kbd>6</kbd> vão direto ao atributo.
      <kbd>Esc</kbd> sai da caixa de escolha.
    </div>
  </section>
</main>
<input id="pasta" type="file" webkitdirectory multiple hidden>

<script src="dados.js"></script>
<script>
"use strict";

const NOMES = {
  top: "Blusa", outerwear: "Casaco", pants: "Calça", dress: "Vestido", skirt: "Saia",
  jumpsuit: "Macacão", bag: "Bolsa", shoes: "Sapato", neckwear: "Lenço e gravata",
  hats: "Chapéu", legwear: "Meia", bracelet: "Pulseira", brooch: "Broche",
  earrings: "Brinco", eyewear: "Óculos", gloves: "Luvas", hairwear: "Acessório de cabelo",
  necklace: "Colar", rings: "Anel", watch: "Relógio",
};
const ROTULOS = {
  estampa: "Estampa", comprimento: "Comprimento", modelagem: "Modelagem",
  estilo: "Estilo", ocasiao: "Ocasião", formalidade: "Formalidade",
};
const $ = (id) => document.getElementById(id);

if (typeof DADOS === "undefined" || !DADOS.pecas || !DADOS.pecas.length) {
  document.body.innerHTML = "<p style='padding:24px'>Não achei o arquivo dados.js. Rode <code>python3 revisao/gerar_dados.py</code> e abra a página de novo.</p>";
  throw new Error("sem dados");
}

const PECAS = DADOS.pecas;
const ATRS = Object.keys(DADOS.valores);
// chave separada para teste: confirmar valores de exemplo nao pode valer para os reais
const CHAVE = "revisao50:" + (DADOS.teste ? "teste" : "real");
const urls = {};
let aberto = false;
let estado = carregar();

function vazio() {
  return { atual: 0, pecas: {} };
}

function carregar() {
  try {
    const bruto = localStorage.getItem(CHAVE);
    if (!bruto) return vazio();
    const e = JSON.parse(bruto);
    if (!e || typeof e.pecas !== "object") return vazio();
    e.atual = Math.min(Math.max(0, e.atual | 0), PECAS.length - 1);
    return e;
  } catch (err) {
    return vazio();
  }
}

function salvar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify(estado));
  } catch (err) {
    // sem armazenamento a pagina segue, so nao lembra depois de fechar
  }
}

function aplica(atr, cat) {
  return DADOS.aplica[atr].includes(cat);
}

function registro(p) {
  return estado.pecas[p.id] || { mudou: {}, confirmada: false };
}

// guarda so o que ela trocou, assim um dados.js novo atualiza o resto sozinho
function valor(p, atr) {
  if (!aplica(atr, p.categoria)) return DADOS.na;
  const r = registro(p);
  return atr in r.mudou ? r.mudou[atr] : (p.rotulos[atr] || "");
}

function mudou(p) {
  return Object.keys(registro(p).mudou).length > 0;
}

function confirmadas() {
  return PECAS.filter((p) => registro(p).confirmada).length;
}

function desenharFaixa() {
  const f = $("faixa");
  f.textContent = "";
  PECAS.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = i + 1;
    b.title = (NOMES[p.categoria] || p.categoria) + " " + p.id;
    if (registro(p).confirmada) b.classList.add("ok");
    if (mudou(p)) b.classList.add("mudou");
    if (i === estado.atual) b.classList.add("atual");
    b.addEventListener("click", () => ir(i));
    f.appendChild(b);
  });
}

function desenharImagem(p) {
  const caixa = $("caixa-img");
  caixa.textContent = "";
  const img = document.createElement("img");
  img.alt = "Foto da peça " + p.id;
  img.addEventListener("error", () => {
    caixa.innerHTML = "<div id='falha'><p>A imagem não abriu. Alguns navegadores bloqueiam fotos de arquivos locais.</p>" +
      "<p>Escolha a pasta <b>dados/imagens</b> do projeto.</p>" +
      "<button type='button' id='escolher'>Escolher pasta das imagens</button></div>";
    $("escolher").addEventListener("click", () => $("pasta").click());
  });
  img.src = urls[p.id + ".jpg"] || p.imagem;
  caixa.appendChild(img);
}

function desenharCampos(p) {
  const c = $("campos");
  c.textContent = "";
  ATRS.forEach((atr, k) => {
    const linha = document.createElement("div");
    linha.className = "campo";
    const rot = document.createElement("label");
    rot.htmlFor = "sel-" + atr;
    rot.innerHTML = "<kbd>" + (k + 1) + "</kbd>";
    rot.appendChild(document.createTextNode(ROTULOS[atr] || atr));
    const sel = document.createElement("select");
    sel.id = "sel-" + atr;
    linha.append(rot, sel);

    if (!aplica(atr, p.categoria)) {
      sel.add(new Option(DADOS.na, DADOS.na));
      sel.disabled = true;
    } else {
      const atual = valor(p, atr);
      if (!atual) {
        const o = new Option("escolha...", "");
        o.disabled = true;
        sel.add(o);
        linha.classList.add("vazio");
      }
      DADOS.valores[atr].filter((v) => v !== DADOS.na).forEach((v) => sel.add(new Option(v, v)));
      sel.value = atual;
      const orig = p.rotulos[atr] || "";
      if (atr in registro(p).mudou) {
        linha.classList.add("mudou");
        const antes = document.createElement("div");
        antes.className = "antes";
        antes.textContent = "antes: " + (orig || "em branco");
        linha.appendChild(antes);
      }
      sel.addEventListener("mousedown", () => { aberto = true; });
      sel.addEventListener("blur", () => { aberto = false; });
      sel.addEventListener("change", () => {
        aberto = false;
        trocar(p, atr, sel.value);
      });
    }
    c.appendChild(linha);
  });
}

function trocar(p, atr, v) {
  const r = registro(p);
  if (v === (p.rotulos[atr] || "")) delete r.mudou[atr];
  else r.mudou[atr] = v;
  // mexeu de novo depois de confirmar: precisa confirmar outra vez
  r.confirmada = false;
  estado.pecas[p.id] = r;
  salvar();
  const foco = document.activeElement && document.activeElement.id;
  desenhar();
  if (foco && $(foco)) $(foco).focus();
}

function desenhar() {
  const p = PECAS[estado.atual];
  const r = registro(p);
  const nome = NOMES[p.categoria] || p.categoria;
  $("progresso").innerHTML = "<b>" + (estado.atual + 1) + " de " + PECAS.length + "</b> · " +
    confirmadas() + " confirmadas";
  $("titulo").textContent = nome;
  $("ident").textContent = p.categoria + " · id " + p.id;
  $("selo").style.display = r.confirmada ? "" : "none";
  $("legenda").textContent = p.legenda || "Sem legenda.";
  $("descricao").textContent = p.descricao || "";
  $("aviso").textContent = "";
  $("pronto").style.display = confirmadas() === PECAS.length ? "block" : "none";
  $("teste").style.display = DADOS.teste ? "block" : "none";
  desenharFaixa();
  desenharCampos(p);
}

function ir(i) {
  if (i < 0 || i >= PECAS.length) return;
  estado.atual = i;
  salvar();
  desenhar();
  const p = PECAS[i];
  desenharImagem(p);
  aberto = false;
  if (document.activeElement && document.activeElement.tagName === "SELECT") document.activeElement.blur();
}

function confirmar() {
  const p = PECAS[estado.atual];
  const faltam = ATRS.filter((a) => !valor(p, a));
  if (faltam.length) {
    $("aviso").textContent = "Falta escolher: " + faltam.map((a) => ROTULOS[a] || a).join(", ") + ".";
    return;
  }
  const r = registro(p);
  r.confirmada = true;
  estado.pecas[p.id] = r;
  salvar();
  // segue para a proxima sem confirmar, dando a volta se precisar
  for (let k = 1; k <= PECAS.length; k++) {
    const j = (estado.atual + k) % PECAS.length;
    if (!registro(PECAS[j]).confirmada) return ir(j);
  }
  desenhar();
}

function csv(c) {
  const s = String(c);
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportar() {
  const cab = ["id", "categoria"].concat(ATRS, ["confirmada"]);
  const linhas = [cab.join(",")];
  PECAS.forEach((p) => {
    const v = ATRS.map((a) => valor(p, a));
    linhas.push([p.id, p.categoria].concat(v, [registro(p).confirmada ? "sim" : "nao"]).map(csv).join(","));
  });
  const blob = new Blob(["﻿" + linhas.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "revisao_50.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function recomecar() {
  if (!confirm("Apagar todas as respostas e voltar para a primeira peça?")) return;
  estado = vazio();
  try { localStorage.removeItem(CHAVE); } catch (err) { /* sem armazenamento */ }
  ir(0);
}

$("pasta").addEventListener("change", (e) => {
  let n = 0;
  for (const f of e.target.files) {
    if (/\.jpe?g$/i.test(f.name)) {
      if (urls[f.name]) URL.revokeObjectURL(urls[f.name]);
      urls[f.name] = URL.createObjectURL(f);
      n++;
    }
  }
  if (!n) alert("Não achei arquivos .jpg nessa pasta.");
  desenharImagem(PECAS[estado.atual]);
  e.target.value = "";
});

$("confirmar").addEventListener("click", confirmar);
$("anterior").addEventListener("click", () => ir(estado.atual - 1));
$("proxima").addEventListener("click", () => ir(estado.atual + 1));
$("exportar").addEventListener("click", exportar);
$("recomecar").addEventListener("click", recomecar);

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) {
    if (e.target.tagName === "SELECT") aberto = true;
    return;
  }
  const emSelect = e.target.tagName === "SELECT";
  if (emSelect && e.key === " ") aberto = true;
  if (e.key === "Escape" && emSelect) {
    aberto = false;
    e.target.blur();
    return;
  }
  if (e.key === "Enter") {
    // Enter num botao ja vira clique; com a lista aberta o Enter escolhe a opcao
    if (e.target.tagName === "BUTTON") return;
    if (emSelect && aberto) {
      // se ela fechou a lista sem trocar nada, o proximo Enter ja confirma
      aberto = false;
      return;
    }
    e.preventDefault();
    confirmar();
    return;
  }
  if (emSelect) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); ir(estado.atual - 1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); ir(estado.atual + 1); }
  else if (/^[1-6]$/.test(e.key)) {
    const sel = $("sel-" + ATRS[+e.key - 1]);
    if (sel && !sel.disabled) { e.preventDefault(); sel.focus(); }
  }
});

ir(estado.atual);
</script>
</body>
</html>
